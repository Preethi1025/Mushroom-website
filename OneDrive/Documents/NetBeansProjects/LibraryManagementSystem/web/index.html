<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Library Management</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <style>
        body {
            font-size: 20px;
            background-color: #f1f5f9;
        }

        .checkbox-container {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 20px;
            margin-bottom: 25px;
        }

        .checkbox-group {
            display: flex;
            flex-direction: column;
            border: 2px solid #343a40;
            padding: 10px;
            border-radius: 6px;
            background: #ffffff;
            min-width: 250px;
        }

        .checkbox-group label {
            font-size: 15px;
            margin-bottom: 5px;
        }

        .button-container {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-bottom: 25px;
        }

        /* Table Styling */
        .table {
            width: 95%;
            margin: auto;
            border: 3px solid #343a40;
            font-size: 15px;
        }

        .table th, .table td {
            text-align: center;
            border: 3px solid #343a40;
            padding: 15px;
        }

        .table-responsive {
            max-width: 98%;
            max-height: 600px;
            margin: auto;
            overflow-y: auto;
        }
    </style>
</head>
<body>
    <div class="container mt-4">
        <center>
            <img src="title.png" style="width: 1000px; height: 60px;">
        </center>

        <div class="mb-3">
            <label class="fw-bold">Selected Criteria:</label>
            <span id="selectedCriteria" class="text-primary">None</span>
        </div>

        <div class="checkbox-container">
            <div class="checkbox-group">
                <label><b>Year</b></label>
                <label><input type="checkbox" name="year" value="2023" onchange="fetchData()"> 2023</label>
                <label><input type="checkbox" name="year" value="2024" onchange="fetchData()"> 2024</label>
            </div>

            <div class="checkbox-group">
                <label><b>Semester</b></label>
                <label><input type="checkbox" name="semester" value="ODD" onchange="fetchData()"> ODD</label>
                <label><input type="checkbox" name="semester" value="EVEN" onchange="fetchData()"> EVEN</label>
            </div>

            <div class="checkbox-group">
                <label><b>Purchase Type</b></label>
                <label><input type="checkbox" name="purchaseType" value="Purchase" onchange="fetchData()"> Purchase</label>
                <label><input type="checkbox" name="purchaseType" value="Specimen" onchange="fetchData()"> Specimen</label>
                <label><input type="checkbox" name="purchaseType" value="Donation" onchange="fetchData()"> Donation</label>
            </div>

            <div class="checkbox-group">
                <label><b>Department</b></label>
                <label><input type="checkbox" name="department" value="ALL" onchange="fetchData()"> ALL</label>
                <label><input type="checkbox" name="department" value="CSE" onchange="fetchData()"> CSE</label>
                <label><input type="checkbox" name="department" value="EEE" onchange="fetchData()"> EEE</label>
                <label><input type="checkbox" name="department" value="MECH" onchange="fetchData()"> MECH</label>
                <label><input type="checkbox" name="department" value="IT" onchange="fetchData()"> IT</label>
                <label><input type="checkbox" name="department" value="CIVIL" onchange="fetchData()"> CIVIL</label>
                <label><input type="checkbox" name="department" value="CSBS" onchange="fetchData()"> CSBS</label>
                <label><input type="checkbox" name="department" value="AIML" onchange="fetchData()"> AIML</label>
                <label><input type="checkbox" name="department" value="MBA" onchange="fetchData()"> MBA</label>
                <label><input type="checkbox" name="department" value="Tamil" onchange="fetchData()"> Tamil</label>
            </div>

            <div class="checkbox-group">
                <label><b>Supplier</b></label>
                <label><input type="checkbox" name="supplier" value="TBH" onchange="fetchData()"> TBH</label>
                <label><input type="checkbox" name="supplier" value="Dhanam" onchange="fetchData()"> Dhanam</label>
                <label><input type="checkbox" name="supplier" value="Amazon" onchange="fetchData()"> Amazon</label>
                <label><input type="checkbox" name="supplier" value="Lakshmi Publication" onchange="fetchData()"> Lakshmi Publications</label>
                <label><input type="checkbox" name="supplier" value="MR Anburaj Civil" onchange="fetchData()"> MR Anburaj Civil</label>
                <label><input type="checkbox" name="supplier" value="Dr Rajkumar" onchange="fetchData()"> Dr Rajkumar</label>
            </div>
        </div>

        <div class="button-container">
            <a href="statements.html" class="btn btn-primary btn-lg">View Statement</a>
            <a href="form.html" class="btn btn-primary btn-lg">New</a>
            <button class="btn btn-success btn-lg" onclick="downloadCSV()">Download CSV</button>
        </div>

        <div class="table-responsive">
            <table class="table table-bordered">
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Semester</th>
                        <th>Engg/MBA</th>
                        <th>Date of Invoice</th>
                        <th>Purchase Type</th>
                        <th>Book accn_from</th>
                        <th>Book accn_to</th>
                        <th>Invoice No</th>
                        <th>Supplier Name</th>
                        <th>Department</th>
                        <th>No. of Books</th>
                        <th>Gross Invoice Amount</th>
                        <th>Discount Amount</th>
                        <th>Net Amount</th>
                    </tr>
                </thead>
                <tbody id="tableBody">
                    <!-- Data will be dynamically inserted here -->
                </tbody>
            </table>
        </div>
    </div>

    <script>
      function fetchData() {
    let queryParams = new URLSearchParams(); 
    let criteria = {}; 

    document.querySelectorAll(".checkbox-group input:checked").forEach(checkbox => {
        let key = checkbox.name;  // Get the category name (e.g., 'semester', 'year', etc.)
        if (!criteria[key]) criteria[key] = [];
        criteria[key].push(checkbox.value);
    });

    // Updating selected criteria display
    let criteriaText = Object.entries(criteria)
        .map(([key, values]) => `${key}: ${values.join(", ") || 'All'}`)
        .join(" | ");
    document.getElementById("selectedCriteria").innerText = criteriaText || "None";

    // Adding multiple selections correctly in query parameters
    Object.entries(criteria).forEach(([key, values]) => {
        values.forEach(value => queryParams.append(key, value));
    });

    console.log("Final Query:", queryParams.toString()); // Debugging

    // Sending request with correctly formatted parameters
    fetch("fetchData.jsp?" + queryParams.toString())
        .then(response => response.text())
        .then(data => {
            document.getElementById("tableBody").innerHTML = data;
        })
        .catch(error => console.error("Fetch error:", error));
}
    function downloadCSV() {
    let queryParams = new URLSearchParams();
    let criteria = {};

    document.querySelectorAll(".checkbox-group input:checked").forEach(checkbox => {
        let key = checkbox.name;  // Get the category name (e.g., 'semester', 'year', etc.)
        if (!criteria[key]) criteria[key] = [];
        criteria[key].push(checkbox.value);
    });

    // Adding multiple selections correctly in query parameters
    Object.entries(criteria).forEach(([key, values]) => {
        values.forEach(value => queryParams.append(key, value));
    });

    // Debugging
    console.log("Download CSV Query:", queryParams.toString());

    // Redirecting to download CSV
    window.location.href = "downloadCSV.jsp?" + queryParams.toString();
}

    </script>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
